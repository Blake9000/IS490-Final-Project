{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · JobIntel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'resume_fixer/css/jobintel.css' %}" rel="stylesheet">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <a class="brand text-decoration-none auth-brand" href="{% url 'dashboard' %}">
            <span class="brand-mark"></span>
            <span>JobIntel</span>
        </a>
        <div class="auth-heading">
            <h1 class="page-title mb-1">Login</h1>
            <p class="page-subtitle mb-0">Access resume analysis, job matching, and market trend tools.</p>
        </div>
        <form class="auth-form" method="post" action="#">
            {% csrf_token %}
            <div class="auth-field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com">
            </div>
            <div class="auth-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password">
            </div>
            <div class="auth-options d-flex justify-content-between align-items-center">
                <label class="auth-check">
                    <input type="checkbox" name="remember_me">
                    <span>Remember me</span>
                </label>
                <a class="view-link" href="#">Forgot password?</a>
            </div>
            <button class="auth-submit" type="button">Login</button>
        </form>
        <div class="auth-footer">
            <span>New to JobIntel?</span>
            <a class="view-link" href="#">Create account</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
